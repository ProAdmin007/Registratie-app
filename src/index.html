<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3a8c">
<meta name="color-scheme" content="light">
<!-- Content-Security-Policy: geen externe bronnen; connect-src 'self' voorkomt dat gegevens naar een andere server kunnen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src blob: mediastream:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Registratie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a3a8c'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' d='M12 24V12h12M40 12h12v12M52 40v12H40M24 52H12V40'/%3E%3Crect x='25' y='25' width='14' height='14' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<!-- @inline styles.css -->
</head>
<body>

<!-- Iconen (eenmalig gedefinieerd, overal hergebruikt via <use>) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h2.5v2.5H14zM20.5 14v.01M18 18.5h2.5v2M14 20.5h.01"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.5h.01"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true"><svg class="ic"><use href="#i-qr"/></svg></div>
    <div>
      <h1>Registratie</h1>
      <p>Scan QR-codes en registreer de locatie</p>
    </div>
  </div>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <!-- Scannen -->
  <section class="card scan-card" id="scanSection">
    <button id="btnScan" class="btn btn-primary btn-hero" type="button">
      <span class="hero-icon"><svg class="ic"><use href="#i-scan"/></svg></span>
      <span class="hero-text">Scan QR-code<small>Richt de camera op de code</small></span>
    </button>
    <button id="btnPhoto" class="btn btn-outline" type="button" hidden>
      <svg class="ic"><use href="#i-camera"/></svg> Foto maken van QR-code
    </button>
    <button id="btnManual" class="btn btn-ghost" type="button">
      <svg class="ic"><use href="#i-keyboard"/></svg> QR-code handmatig invoeren
    </button>
    <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>

    <div id="scanner" class="scanner" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="scan-frame" aria-hidden="true">
        <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
        <span class="scan-line"></span>
      </div>
      <p class="scan-hint">Houd de QR-code binnen het kader</p>
      <button id="btnStopScan" class="btn btn-stop" type="button">
        <svg class="ic"><use href="#i-x"/></svg> Stoppen
      </button>
    </div>
  </section>

  <!-- Locatie invoeren -->
  <section class="card entry" id="entry" hidden>
    <div class="entry-head">
      <span class="step-dot"><svg class="ic"><use href="#i-check"/></svg></span>
      <span>QR-code gescand – vul de locatie in</span>
    </div>
    <div class="field">
      <label for="qrInput">QR-code</label>
      <div id="qrValue" class="qr-chip"></div>
      <input id="qrInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="bijv. CODE-123456" hidden>
    </div>
    <div class="field">
      <label for="locationInput">Locatie</label>
      <div class="input-icon">
        <svg class="ic"><use href="#i-pin"/></svg>
        <input id="locationInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="bijv. Hoofdstraat 12 Assen">
      </div>
    </div>
    <div id="gpsBox" class="gps-box" data-state="searching" aria-live="polite">
      <svg class="ic"><use href="#i-gps"/></svg>
      <div><span class="gps-label">GPS-positie</span><span id="gpsText">Zoeken…</span></div>
    </div>
    <button id="btnAdd" class="btn btn-success btn-lg" type="button" disabled>
      <svg class="ic"><use href="#i-plus"/></svg> Toevoegen
    </button>
    <button id="btnCancelEntry" class="btn btn-ghost" type="button">Annuleren</button>
  </section>

  <!-- Overzicht -->
  <section class="card" id="listSection">
    <div class="list-head">
      <h2>Registraties</h2>
      <span class="count-pill"><span id="count">0</span></span>
    </div>
    <div id="emptyText" class="empty">
      <svg class="ic"><use href="#i-inbox"/></svg>
      <p><b>Nog niets gescand</b><br>Tik op “Scan QR-code” om te beginnen.</p>
    </div>
    <ol id="list" class="list"></ol>
  </section>

  <!-- Afronden -->
  <section class="card" id="finish">
    <button id="btnExport" class="btn btn-primary btn-lg" type="button">
      <svg class="ic"><use href="#i-file"/></svg> Klaar - CSV maken
    </button>

    <div id="exportResult" class="export-result" hidden>
      <div class="export-head">
        <span class="step-dot ok"><svg class="ic"><use href="#i-check"/></svg></span>
        <div>
          <p class="ok-text">CSV succesvol opgeslagen:</p>
          <p id="exportName" class="filename"></p>
          <p class="muted small">Staat in de map <b>Downloads</b> van het toestel.</p>
        </div>
      </div>
      <button id="btnShare" class="btn btn-primary btn-lg" type="button">
        <svg class="ic"><use href="#i-mail"/></svg> CSV via e-mail versturen
      </button>
      <p id="shareHint" class="hint" hidden></p>
      <button id="btnDownloadAgain" class="btn btn-ghost" type="button">
        <svg class="ic"><use href="#i-download"/></svg> Opnieuw downloaden
      </button>
    </div>
  </section>

  <button id="btnNewRound" class="btn btn-danger-ghost" type="button">
    <svg class="ic"><use href="#i-refresh"/></svg> Nieuwe scanronde
  </button>
</main>

<div id="status" class="status" role="status" aria-live="polite" hidden></div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="dlg-actions">
      <button id="dlgCancel" class="btn btn-outline" value="cancel" type="submit">Annuleren</button>
      <button id="dlgOk" class="btn btn-primary" value="ok" type="submit">OK</button>
    </div>
  </form>
</dialog>

<!-- @inline vendor/jsQR.js -->
<!-- @inline logic.js -->
<!-- @inline app.js -->
</body>
</html>
